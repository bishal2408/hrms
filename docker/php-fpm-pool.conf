; Overrides the default www pool to listen on a unix socket (nginx talks to
; php-fpm over this socket, not TCP) and to log to stderr so `docker logs` /
; Render's log stream actually shows php-fpm output.
[www]
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Conservative for Render's free-tier instance (512MB RAM shared with nginx +
; supervisord + the OS) — raise these if you move to a paid plan with more memory.
pm = dynamic
pm.max_children = 4
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2

catch_workers_output = yes
decorate_workers_output = no
